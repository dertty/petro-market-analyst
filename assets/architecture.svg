<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- фон -->
  <rect x="1" y="1" width="938" height="638" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Браузер -->
  <rect x="60" y="36" width="180" height="56" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Браузер</text>
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#64748b">вопрос → ответ с источниками</text>

  <!-- docker compose -->
  <rect x="40" y="130" width="610" height="310" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="58" y="152" font-size="12" font-style="italic" fill="#64748b">docker compose</text>

  <!-- app -->
  <rect x="70" y="180" width="180" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">app · FastAPI</text>
  <text x="160" y="224" text-anchor="middle" font-size="10.5" fill="#64748b">интерфейс и сессии, :8000</text>

  <!-- skill-enable -->
  <rect x="70" y="330" width="180" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="160" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">skill-enable</text>
  <text x="160" y="372" text-anchor="middle" font-size="10" fill="#64748b">включает свои скиллы, одноразовый</text>

  <!-- Ouroboros -->
  <rect x="300" y="168" width="330" height="252" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="318" y="190" font-size="13.5" font-weight="600" fill="#0f172a">Ouroboros — рантайм агента</text>
  <text x="612" y="190" text-anchor="end" font-size="10" fill="#64748b">:8766→8765</text>

  <rect x="318" y="204" width="294" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="465" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Аналитическая задача</text>
  <text x="465" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">изолированный контекст · веб-поиск · Python</text>

  <rect x="318" y="264" width="140" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="388" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">oil_price_forecast</text>
  <text x="388" y="299" text-anchor="middle" font-size="10" fill="#64748b">forecast · supply_shock</text>
  <text x="388" y="313" text-anchor="middle" font-size="10" fill="#64748b">Chronos-Bolt + ETS</text>

  <rect x="472" y="264" width="140" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="542" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">petro_rag</text>
  <text x="542" y="299" text-anchor="middle" font-size="10" fill="#64748b">rag_search</text>
  <text x="542" y="313" text-anchor="middle" font-size="9.5" fill="#64748b">цитата: отчёт · дата · стр.</text>

  <rect x="472" y="356" width="140" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="542" y="375" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">rag_daemon · companion</text>
  <text x="542" y="391" text-anchor="middle" font-size="9.5" fill="#64748b">e5-large + jina-reranker</text>

  <line x1="542" y1="326" x2="542" y2="352" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Внешний мир -->
  <text x="810" y="152" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">Внешний мир</text>

  <rect x="720" y="168" width="180" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="810" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">OpenRouter</text>
  <text x="810" y="208" text-anchor="middle" font-size="10.5" fill="#64748b">LLM-модели</text>

  <rect x="720" y="248" width="180" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="810" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Веб-поиск</text>
  <text x="810" y="288" text-anchor="middle" font-size="10" fill="#64748b">первоисточники и новости</text>

  <rect x="720" y="328" width="180" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="810" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">EIA Open Data</text>
  <text x="810" y="368" text-anchor="middle" font-size="9.5" fill="#64748b">ряды Brent (RBRTE) и WTI (RWTC)</text>

  <!-- На хосте -->
  <text x="60" y="478" font-size="11" font-style="italic" fill="#64748b">На хосте · под git</text>

  <rect x="70" y="492" width="180" height="60" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="160" y="514" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">knowledge/</text>
  <text x="160" y="532" text-anchor="middle" font-size="10" fill="#64748b">методика и метрики рынка</text>

  <rect x="280" y="492" width="180" height="60" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="370" y="514" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">reports/pdf + index</text>
  <text x="370" y="532" text-anchor="middle" font-size="10" fill="#64748b">PDF-отчёты · Chroma-индекс</text>

  <rect x="520" y="492" width="200" height="60" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="620" y="514" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ingest/ → data/corpus</text>
  <text x="620" y="532" text-anchor="middle" font-size="10" fill="#64748b">24 источника · ~140 документов</text>

  <!-- стрелки -->
  <line x1="152" y1="92" x2="159" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="172" y="138" font-size="10" fill="#64748b">HTTP :8000</text>

  <line x1="250" y1="212" x2="296" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="273" y="204" text-anchor="middle" font-size="10" fill="#64748b">task API</text>

  <line x1="250" y1="362" x2="296" y2="362" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="273" y="354" text-anchor="middle" font-size="10" fill="#64748b">owner API</text>

  <line x1="630" y1="196" x2="716" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="276" x2="716" y2="276" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="356" x2="716" y2="356" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="160" y1="492" x2="160" y2="444" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="492" x2="520" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="520" y1="522" x2="466" y2="522" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="492" y="512" text-anchor="middle" font-size="9.5" fill="#64748b">план</text>

  <!-- примечание -->
  <text x="60" y="606" font-size="10" fill="#64748b">Наружу открыты только :8000 (интерфейс) и :8766 (рантайм, только localhost).</text>
</svg>
