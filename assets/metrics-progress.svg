  .dlt { fill: var(--good); font: 600 10px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
  .flat { fill: var(--muted); font: 600 10px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
  .rule { stroke: var(--rule); stroke-width: 1; }
  .ln { stroke: var(--line); stroke-width: 2; fill: none; stroke-linejoin: round; }
  .pt { fill: var(--card); stroke: var(--line); stroke-width: 2; }
  .pt-last { fill: var(--good); stroke: var(--good); stroke-width: 2; }
