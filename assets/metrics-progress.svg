<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 214" width="940" height="214" role="img" aria-label="Пять метрик по четырём итерациям на одних и тех же пяти вопросах: соответствие протоколу 44, 27, 72, 92 процента; экспертная оценка 80, 70, 80, 80 процентов; латентность 653, 552, 312, 299 секунд; длина траектории 22,6, 15,6, 13,0, 11,8 раунда; стоимость ответа 0,190, 0,164, 0,142, 0,121 доллара">
  <style>
