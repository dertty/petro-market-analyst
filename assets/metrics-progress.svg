      --muted: #8b949e; --line: #a371f7; --good: #3fb950; --rule: #21262d;
    }
  }
  .card { fill: var(--card); stroke: var(--edge); }
  .ttl { fill: var(--text); font: 600 11.5px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
