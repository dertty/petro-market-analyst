<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нефтегазовый аналитик</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --line: #e4e0d8; --ink: #24211d;
    --muted: #7c766c; --accent: #8a5a2b; --ok: #2f7a4a; --err: #a33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 260px 1fr; min-height: 100vh;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 18px 16px; overflow-y: auto;
  }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
             color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .newsession {
    width: 100%; padding: 7px; margin-bottom: 16px; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); font: inherit; font-size: 13px;
  }
  .newsession:hover { border-color: var(--accent); color: var(--accent); }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li {
    padding: 9px 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer;
    font-size: 13px; border: 1px solid transparent;
  }
  .hist li:hover { background: #f4f1ec; }
  .hist li.sel { background: #f4f1ec; border-color: var(--line); }
  .hist .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .empty { color: var(--muted); font-size: 13px; }

  main { padding: 26px 32px 60px; max-width: 900px; }
  h1 { font-size: 21px; margin: 0 0 20px; font-weight: 600; }
  textarea {
    width: 100%; min-height: 76px; padding: 12px; resize: vertical;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    font: inherit; color: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; justify-content: space-between; align-items: center;
         gap: 12px; margin-top: 10px; }
  button.primary {
    padding: 9px 20px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 500;
  }
  button.primary:disabled { background: #c6bdb1; cursor: default; }
  button.ghost {
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: none; cursor: pointer; font: inherit; font-size: 13px;
    color: var(--muted);
  }
  button.ghost:hover { border-color: var(--err); color: var(--err); }

  .status { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px;
            font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.run { background: var(--accent); animation: pulse 1.4s infinite; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  .feed {
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    max-height: 320px; overflow-y: auto; padding: 10px 14px; font-size: 13px;
  }
  .feed .ev { display: flex; gap: 10px; padding: 3px 0; color: #443f38; }
  .feed .t { color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 58px; }
  .feed summary { cursor: pointer; color: var(--muted); font-size: 13px; }

  .answer {
    margin-top: 22px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 26px 20px;
  }
  .answer h2 { font-size: 17px; margin-top: 22px; }
  .answer table { border-collapse: collapse; }
  .answer td, .answer th { border: 1px solid var(--line); padding: 5px 9px; }
  .answer code { background: #f2efe9; padding: 1px 5px; border-radius: 4px; }
  .banner { padding: 11px 14px; border-radius: 8px; margin-bottom: 18px;
            background: #fdf1ee; border: 1px solid #e8c4ba; color: #8a3220; }
  .asked { margin-top: 22px; padding-left: 14px; border-left: 3px solid var(--line);
           white-space: pre-wrap; }
  .hidden { display: none; }
</style>
</head>
<body>
<aside>
  <h2>Эта сессия</h2>
  <button class="newsession" id="newSession">Новая сессия</button>
  <ul class="hist" id="hist"></ul>
  <div class="empty" id="histEmpty">Вопросов пока нет</div>
</aside>

<main>
  <h1>Нефтегазовый аналитик</h1>
  <div class="banner hidden" id="banner"></div>

  <textarea id="q" placeholder="Что происходит с ценами на нефть и какие факторы влияют сейчас?"></textarea>
  <div class="row">
    <span class="empty">Ctrl+Enter — отправить. Ответ занимает несколько минут.</span>
    <button class="primary" id="askBtn">Спросить</button>
  </div>

  <div class="asked hidden" id="asked"></div>

  <div class="status hidden" id="status">
    <span class="dot" id="dot"></span>
    <span id="statusText"></span>
    <button class="ghost hidden" id="cancelBtn">Отменить</button>
  </div>

  <details class="hidden" id="feedBox" open>
    <summary id="feedSummary">Ход работы</summary>
    <div class="feed" id="feed"></div>
  </details>

  <div class="answer hidden" id="answer"></div>
</main>

<script>
// Сессия живёт, пока открыта вкладка: sessionStorage, а не localStorage.
// Перезагрузка страницы начинает новую сессию — так и задумано.
function sessionId() {
  let id = sessionStorage.getItem("analyst_session");
  if (!id) {
    id = "s-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    sessionStorage.setItem("analyst_session", id);
  }
  return id;
}

const $ = (id) => document.getElementById(id);
let currentTask = null, source = null, poller = null, timer = null, startedAt = 0;

function banner(text) {
  if (!text) { $("banner").classList.add("hidden"); return; }
  $("banner").textContent = text;
  $("banner").classList.remove("hidden");
}

// Заданный вопрос над ответом. В поле ввода он остаётся только у живого запроса,
// а у задачи из истории там лежит черновик — без этого блока вопрос не виден.
function showAsked(text) {
  if (!text) { $("asked").classList.add("hidden"); return; }
  $("asked").textContent = text;
  $("asked").classList.remove("hidden");
}

function setStatus(kind, text, cancelable) {
  $("status").classList.remove("hidden");
  $("dot").className = "dot " + kind;
  $("statusText").textContent = text;
  $("cancelBtn").classList.toggle("hidden", !cancelable);
}

function hhmmss(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m} мин ${String(s).padStart(2, "0")} с` : `${s} с`;
}

function startTimer(label) {
  startedAt = Date.now();
  clearInterval(timer);
  timer = setInterval(() => {
    const sec = Math.floor((Date.now() - startedAt) / 1000);
    // Стоимость во время работы не показываем: её просто неоткуда взять —
    // поля стоимости приходят только в терминальном событии.
    setStatus("run", `${label} · ${hhmmss(sec)}`, true);
  }, 1000);
}

function stopTimer() { clearInterval(timer); timer = null; }

function addEvent(ev) {
  const src = ev.source || "";
  if (src === "supervisor") return;              // служебный шум
  const data = ev.data || {};
  let text = "";
  if (ev.type === "progress") text = data.text || data.message || "";
  else if (ev.type === "tool_call") {
    const name = data.tool || data.name || "инструмент";
    const arg = data.query || data.url || data.path || "";
    text = arg ? `${name}: ${arg}` : name;
  } else if (ev.type === "message") text = data.text || "";
  if (!text) return;

  const row = document.createElement("div");
  row.className = "ev";
  const ts = (ev.ts || "").slice(11, 19);
  row.innerHTML = `<span class="t"></span><span class="x"></span>`;
  row.querySelector(".t").textContent = ts;
  row.querySelector(".x").textContent = String(text).slice(0, 400);
  $("feed").appendChild(row);
  $("feed").scrollTop = $("feed").scrollHeight;
}

function openStream(taskId) {
  if (source) source.close();
  source = new EventSource(`/stream/${taskId}`);
  // События именованные: onmessage их НЕ поймает.
  source.addEventListener("task_event", (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === "task_result") { finish(taskId); return; }
    addEvent(ev);
  });
  // Поток штатно закрывается по истечении wait — браузер переподключается сам
  // и присылает Last-Event-ID, который прокси отдаёт апстриму как cursor.
  source.onerror = () => {};
}

// Страховка: терминальное событие может не доехать, если поток оборвётся ровно
// на нём. Тогда без опроса страница висела бы в «идёт анализ» навсегда.
function startPolling(taskId) {
  clearInterval(poller);
  poller = setInterval(async () => {
    try {
      const r = await fetch(`/result/${taskId}`);
      const d = await r.json();
      if (d.final) finish(taskId);
      else if (d.status === "pending" || d.status === "scheduled") {
        if (!timer) startTimer("В очереди");
      }
    } catch { /* сеть моргнула — следующий тик */ }
  }, 5000);
}

async function finish(taskId) {
  if (currentTask !== taskId) return;
  const r = await fetch(`/result/${taskId}`);
  const d = await r.json();
  if (!d.final) return;   // task_result пришёл на промежуточный статус — это не конец

  clearInterval(poller); poller = null;
  if (source) { source.close(); source = null; }
  stopTimer();

  const ok = d.status === "completed";
  const cost = d.cost_usd == null ? "" : ` · $${Number(d.cost_usd).toFixed(4)}`;
  const pending = d.cost_final === false ? " (учёт расхода не закрыт)" : "";
  setStatus(ok ? "ok" : "err",
            (ok ? "Готово" : `Завершено: ${d.status}`) + cost + pending, false);

  $("feedBox").open = false;
  $("feedSummary").textContent = "Ход работы (свернуть/развернуть)";

  if (d.answer_html) {
    $("answer").innerHTML = d.answer_html;
    $("answer").classList.remove("hidden");
  } else {
    banner(`Ответ пуст. Статус: ${d.status}${d.reason_code ? ", причина: " + d.reason_code : ""}.`);
  }
  $("askBtn").disabled = false;
  loadHistory();
}

async function ask() {
  const question = $("q").value.trim();
  if (!question) return;
  banner("");
  showAsked(question);
  $("askBtn").disabled = true;
  $("answer").classList.add("hidden");
  $("feed").innerHTML = "";
  $("feedBox").classList.remove("hidden");
  $("feedBox").open = true;
  $("feedSummary").textContent = "Ход работы";

  let data;
  try {
    const r = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, session_id: sessionId() }),
    });
    data = await r.json();
    if (!r.ok) throw new Error(data.error || "Не удалось создать задачу");
  } catch (e) {
    banner(e.message);
    $("askBtn").disabled = false;
    setStatus("err", "Ошибка", false);
    return;
  }

  currentTask = data.task_id;
  startTimer("Идёт анализ");
  openStream(currentTask);
  startPolling(currentTask);
  loadHistory();
}

async function loadHistory() {
  let data;
  try {
    const r = await fetch(`/history?session_id=${encodeURIComponent(sessionId())}`);
    data = await r.json();
  } catch { return; }
  const list = (data.tasks || []).slice().reverse();
  $("histEmpty").classList.toggle("hidden", list.length > 0);
  const ul = $("hist");
  ul.innerHTML = "";
  for (const t of list) {
    const li = document.createElement("li");
    if (t.task_id === currentTask) li.className = "sel";
    const time = (t.ts || "").slice(11, 16);
    const cost = t.cost_usd == null ? "" : ` · $${Number(t.cost_usd).toFixed(4)}`;
    const q = document.createElement("div");
    q.textContent = t.question || "(без вопроса)";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${time}${cost} · ${t.status}`;
    li.append(q, meta);
    li.onclick = () => showSaved(t.task_id, t.question);
    ul.appendChild(li);
  }
}

async function showSaved(taskId, question) {
  // Пустой id ушёл бы в /result/ — маршрута с пустым параметром нет, и вместо
  // ответа пришло бы 404 без поля status, то есть «Статус: undefined».
  if (!taskId) { banner("У задачи нет идентификатора — открыть ответ нельзя."); return; }
  const r = await fetch(`/result/${taskId}`);
  const d = await r.json();
  currentTask = taskId;
  showAsked(question);
  $("feedBox").classList.add("hidden");
  if (d.answer_html) {
    $("answer").innerHTML = d.answer_html;
    $("answer").classList.remove("hidden");
    banner("");
  } else {
    $("answer").classList.add("hidden");
    banner(`Ответа нет. Статус: ${d.status}.`);
  }
  const cost = d.cost_usd == null ? "" : ` · $${Number(d.cost_usd).toFixed(4)}`;
  setStatus(d.status === "completed" ? "ok" : "err", `${d.status}${cost}`, false);
  loadHistory();
}

async function checkReady() {
  try {
    const r = await fetch("/ready");
    const d = await r.json();
    if (!d.ready) banner(d.error || "Рантайм не готов");
  } catch {
    banner("Приложение не может достучаться до Ouroboros.");
  }
}

$("askBtn").onclick = ask;
$("q").addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "Enter") ask();
});
$("cancelBtn").onclick = async () => {
  if (!currentTask) return;
  await fetch(`/cancel/${currentTask}`, { method: "POST" });
  setStatus("err", "Отменяется…", false);
};
$("newSession").onclick = () => {
  sessionStorage.removeItem("analyst_session");
  sessionId();
  currentTask = null;
  if (source) { source.close(); source = null; }
  clearInterval(poller); stopTimer();
  $("answer").classList.add("hidden");
  $("feedBox").classList.add("hidden");
  $("status").classList.add("hidden");
  showAsked("");
  banner("");
  loadHistory();
};

sessionId();
loadHistory();
checkReady();
</script>
</body>
</html>
