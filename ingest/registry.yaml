  # Forbidden как с честным User-Agent ingest-скрипта, так и со стандартным браузерным
  # User-Agent (curl -A "Mozilla/5.0 ..."), включая корень opec.org. Это защита на уровне
  # CDN/WAF, а не проверка заголовка — обхода не подбираем, по правилу из плана.
  # ID и метаданные сохранены, чтобы решение было обратимо сменой status одним словом,
  # если у OPEC появится другой канал доступа (API, партнёрский фид и т.п.).

