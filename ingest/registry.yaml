    status: skip
    reason: blocked
    publisher: OPEC
    series: Monthly Oil Market Report
    landing: https://www.opec.org/monthly-oil-market-report.html
    note: "403 с честным и с браузерным User-Agent при разведке 2026-08-09. Приоритетный источник — пересмотреть при появлении другого канала."

