# Реестр источников для сбора корпуса отраслевых отчётов.
#
# Единственный список, из которого работает загрузчик (ingest/collect.py). Источник
# перечисления — oil_industry_reports_rag_catalog.md (66 строк). Каждая строка каталога
# здесь представлена одной записью со статусом status: collect|skip и, для skip, полем
# reason. Так отбор проверяем и обратим, а не растворён в решении, принятом один раз в
# переписке.
#
# status: collect — источник качается автосбором.
# status: skip     — источник в реестре учтён, но не качается. reason:
#   series  — числовой временной ряд, не документ (эта итерация берёт только документы).
#             Две строки внутри series спорные (MINFIN-001, DOE-001, см. note) — формально
#             документ/пресс-релиз, по содержанию число; решение переигрывается сменой
#             reason на collect одним словом, без правки остальных полей.
#   access  — требует регистрации или подписки (эта итерация берёт только открытый доступ).
#   blocked — по каталогу открытый доступ, но при разведке (ingest/probe.py, 2026-08-09)
#             хост отдал 403/402 и честному User-Agent ingest-скрипта, и стандартному
#             браузерному (см. note каждой записи). Это защита уровня CDN/WAF, а не
#             политика доступа издателя — обхода не подбираем, по правилу из design-плана.
#             landing сохранён, чтобы решение было обратимо сменой status одним словом.
#
# access (для collect) — фактический режим доступа: open. Здесь других значений нет: всё,
# что не open, попало в status: skip, reason: access.
#
# license — из чего исходит загрузчик при выборе метода поставки, информационное поле,
# не юридическая проверка. Перед распространением корпуса — сверить самостоятельно.
#
# strategy (для collect) — см. ingest/strategies.py:
#   date_pattern — URL выводится из календаря без обращения к странице-списку. Использована
#                  только там, где шаблон подтверждён явной проверкой (см. params.verified).
#   listing      — GET страницы-списка (params.landing), ссылки на файлы разбираются оттуда;
#                  URL исторических выпусков заранее не фиксируется.
#   feed         — постраничный обход ленты событий, окно — depth.months.
#   single       — один текущий документ без истории; новая версия — по изменившемуся sha256.
#
# depth — глубина сбора: months (для monthly/weekly/event) или editions (для annual).

sources:

